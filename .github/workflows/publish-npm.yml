name: Publish npm

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
      - name: Skip if version already on npm
        id: gate
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view hs-webapp-coding-init@"$PKG_VERSION" version 2>/dev/null || true)
          if [ -n "$PUBLISHED" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::hs-webapp-coding-init@$PKG_VERSION already published, skipping."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.already_published != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
